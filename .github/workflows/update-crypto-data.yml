name: Update crypto data

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, at 17 minutes past (UTC)
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:                        # runs once right after you push changes to the script
    branches: [main]
    paths:
      - update_crypto.py
      - .github/workflows/update-crypto-data.yml

permissions:
  contents: write

concurrency:
  group: crypto-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python update_crypto.py
        env:
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f crypto-data.json ]; then echo "No data yet"; exit 0; fi
          git add crypto-data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update crypto data"
            git pull --rebase origin main
            git push
          fi
