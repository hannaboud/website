name: Update bond data

on:
  schedule:
    - cron: "30 13 * * 1-5"   # weekdays, 9:30 am New York (summer time)
    - cron: "30 22 * * 1-5"   # weekdays, 6:30 pm New York (summer time)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests numpy
      - run: python update_data.py
      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bonds-data.json
          git diff --cached --quiet || (git commit -m "Update bond data" && git push)
